    <h2>お問い合わせ</h2>
    <form action="/submit" method="POST">
        <div>
            <label for="content-name">お名前：</label>
            <input type="text" id="content-name" name="name" required>
        </div>
        <div>
            <label for="content-category">お問い合わせ種別</label>
            <select id="content-category" name="category">
                <option value="">-- 選択してください --</option>
                <option value="general">一般的なお問い合わせ</option>
                <option value="feedback">ご意見・ご要望</option>
            </select>
        </div>
        <div>
            <label for="content-message">お問い合わせ内容</label>
            <textarea id="content-message" name="content-message" rows="5"></textarea>
        </div>
        <div>
            <button type="submit">送信する</button>
        </div>
</form>
